# --- Facets ------------------------------------------------------------------
# What a story *is*, as opposed to where it lives. A story has one topic and any
# number of facets, and they stack: "agents" inside "Speed, memory & cost".
#
# These are regexes, not descriptions, and that is deliberate. Some subjects cut
# across the whole spine -- an agent paper is also a safety paper, a benchmark
# paper, a coding paper -- and similarity cannot separate those because they
# really are all of them at once. A word either appears or it does not: matching
# `agent` finds 25% of the feed, where scoring a description against the same
# corpus found 5% and put the rest under whatever it most resembled.
#
# Patterns run case-insensitively over each story's titles and summaries.

[[facets]]
slug = "agents"
name = "Agents"
pattern = "\\bagent(s|ic)?\\b"

[[facets]]
slug = "benchmark"
name = "Benchmarks"
pattern = "\\bbenchmark|\\beval(uation)?s?\\b|leaderboard"

[[facets]]
slug = "open-source"
name = "Open source"
pattern = "\\bopen[- ]source|\\bopen[- ]weight|apache 2|\\bMIT licen"

[[facets]]
slug = "coding"
name = "Code"
pattern = "\\bcode\\b|\\bcoding\\b|software engineer|SWE-bench|\\brepositor"

[[facets]]
slug = "safety"
name = "Safety"
pattern = "\\bsafety\\b|jailbreak|prompt injection|\\balignment\\b|misalign"

[[facets]]
slug = "multimodal"
name = "Multimodal"
pattern = "\\bvision\\b|\\bimage(s)?\\b|\\bvideo\\b|multimodal|\\bvisual\\b"

# --- Entities ----------------------------------------------------------------
# Who a story is about. A new model is its lab *and* its model line *and* a
# frontier release -- three different questions, and only the last one is a
# topic. Entities are the axis that stops the other two being forced into it.
#
# Matched by name and alias, never by similarity: these are proper nouns, and
# recognising a proper noun does not need a model. Seeded here with the ones
# worth having on day one; everything else arrives by extraction and is accepted
# by hand, which is the propose-then-accept rule topics already follow.
#
# Keep aliases unambiguous. A bare "Meta" matches "meta-learning", which is why
# the org below is named in full.

