# --- Discussion --------------------------------------------------------------

# Reddit needs no API key -- the .rss endpoints are public Atom and work
# unauthenticated. Three things make it work, and all three matter:
#
#   - A descriptive User-Agent. A default or blank one gets 403 HTML before the
#     rate limiter is even reached. `http.py` already sends one.
#   - The multireddit form. Reddit allows roughly one request per IP per minute,
#     and `a+b+c` spends a single token to cover all three, correctly interleaved.
#     Separate sources would 429 each other.
#   - `www.reddit.com`. `old.reddit.com/.rss` now redirects to a login.
#
# Self-text posts carry real prose; link posts are title-and-thumbnail only, so
# this behaves like Hacker News for half its items.
[[sources]]
kind = "rss"
name = "Reddit AI"
url = "https://www.reddit.com/r/LocalLLaMA+MachineLearning+singularity/.rss"

# Titles and links only -- the description is a bare "Comments" link, so these
# items depend on `describe.py` for anything to embed.
[[sources]]
kind = "rss"
name = "lobste.rs AI"
url = "https://lobste.rs/t/ai.rss"


