# --- Triage ------------------------------------------------------------------
# A relevance *score*, not a gate. Every item is scored by its highest cosine
# similarity to the interest sentences below, and everything fetched becomes a
# story either way: following is what filters the feed now, because a reader's
# own subjects beat one profile of prose written for everybody.
#
# What the score still does: it is `relevance` in the ranking, so what this
# profile dislikes sinks in Trending. `threshold`, `exclude` and the keyword
# lists decide the kept/rejected verdict, which no longer hides anything and is
# now only read by `trib triage --show` and the `below triage` column in
# `trib topics --stats`.
#
# These are embeddings, not keywords: write sentences describing the kind of
# thing you want, not search terms. Tune with `trib triage --show` and
# `trib explain <id>`.
#
# bge puts unrelated text near 0.5, so the usable range is roughly 0.5-1.0.

[triage]
# No longer a cut: it only labels an item kept or rejected for the diagnostics.
threshold = 0.66

interests = [
    "a new large language model is released, with benchmarks and capabilities",
    "an open source AI tool, library or framework you can run yourself",
    "research on language model reasoning, training methods or architecture",
    "AI agents, tool use, and the protocols that connect models to systems",
    "running models locally: quantization, inference speed, GPU requirements",
    "evaluation, benchmarks and measuring what models can actually do",
    "AI safety, interpretability, alignment and model behaviour research",
    "adversarial attacks, jailbreaks, prompt injection and model security",
    "how developers build with LLMs in practice: prompting, RAG, fine-tuning",
    "multimodal models that handle images, audio or video",
    "deep learning fundamentals: architectures, embeddings, generative models",
    "computer vision, reinforcement learning and classical machine learning",
    "the economics and infrastructure of AI: chips, compute, datacenters",
    "AI companies: acquisitions, lab moves, funding and competitive dynamics",
    "AI policy, regulation and copyright as they affect what gets built",
]

exclude = [
    "conference marketing, ticket sales, exhibitor booths and sponsorships",
    "cryptocurrency, blockchain, NFTs and token prices",
    "consumer gadget reviews, phones, smartwatches and TVs",
    "social media platform features, influencers and creator monetisation",
    "stock market movements, earnings calls and analyst price targets",
    "generic startup funding rounds with no technical substance",
]

always_keep = ["anthropic", "claude", "gpt-", "gemini", "llama", "deepseek", "qwen", "mistral"]
always_drop = []

# --- Topics ------------------------------------------------------------------
# Where a story lives. A story gets exactly one home, chosen by best fit, so
# there is nothing to tune: no threshold, no cap, no ranking. Adding a topic
# takes stories from its neighbours rather than adding another label to them.
#
# Only leaves are scored. A shelf earns its stories from whichever of its leaves
# wins, so a shelf's `description` is documentation for whoever edits this file,
# never an input -- that is what stopped a broad topic swallowing the feed.
#
# A description is a sentence describing the kind of story that belongs here,
# not search terms. It is embedded and compared, so write it the way the stories
# themselves are written. Keywords belong in `[[facets]]` below, which is a
# different mechanism for a different job.
#
# Nothing here is AI-specific by design. Replacing this spine, the facets and
# the triage profile is most of what pointing Tributary at another subject means.

[topics]
# Not a tuning knob. A story scoring below this against every leaf is one the
# spine has no opinion about at all. Raising it to keep filler out of topics was
# measured on 2026-09-22 and rejected: short AI posts score as low as filler, so
# it cuts news as fast as noise. CLAUDE.md has the numbers.
floor = 0.55

# Two leaves on the same shelf within this of each other means the shelf is
# clear and the leaf is not, so the story sits on the shelf. Those piles are
# where `/suggest-topics` looks for a leaf that is missing.
park_margin = 0.02

# --- Language models ---
[[topics.spine]]
slug = "models"
name = "Language models"
description = "the models themselves, as things that get released and used"

[[topics.spine]]
slug = "frontier"
parent = "models"
name = "Frontier model releases"
description = "a new flagship model such as GPT, Claude, Gemini or Grok is released or leaked, and what changed from the previous version"
# A launch post is benchmarks, pricing and safety, and its prose scores against
# whatever those resemble -- 4 of 16 launches in a fortnight reached this leaf.
# Its title says what it is, so the title decides: the lexical question first,
# the way facets ask it. Read on the headline only, and never a paper's.
claims = '''
^ (?: \[ [^\]]* \] \s* )?                  # a Reddit-style tag such as [N]
(?P<launch>                                # "Introducing ...", "OpenAI releases ..."
    (?: introducing | announcing | meet
      | (?: openai | anthropic | google (?: \s+ deepmind )? | deepmind | xai ) \s+
        (?: releases | launches | announces | unveils | introduces | debuts | ships | rolls \s+ out | drops )
    ) \s+ (?: the \s+ )? (?: new \s+ )?
)?
(?: gpt -? \d                              # a flagship line with a version on it --
  | claude \s+ (?: (?: opus | sonnet | haiku ) \s+ )? \d   # "Claude Code 2.0" is a tool
  | (?: opus | sonnet | haiku ) \s+ \d
  | gemini \s+ \d                          # and "Gemini CLI" is too
  | grok \s+ \d
) (?: \. \d+ )? [a-z]? \b                  # GPT-4o yes, GPT4All no
(?(launch) | (?: \s+ [\w.'’-]+ ){0,3} \s* $ )   # bare, the name is nearly all of it
'''

