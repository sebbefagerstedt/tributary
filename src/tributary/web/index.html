<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Tributary</title>
<style>
:root {
  --bg: #f7f7f5;
  --surface: #ffffff;
  --surface-2: #f0efec;
  --text: #16181d;
  --muted: #6b7280;
  --faint: #9ca3af;
  --line: #e4e3df;
  --accent: #2563eb;
  --shadow: 0 1px 2px rgba(16,18,29,.06), 0 4px 12px rgba(16,18,29,.04);
  --paper: #7c3aed; --model: #2563eb; --repo: #b45309;
  --discussion: #0891b2; --article: #15803d; --video: #dc2626;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0d10; --surface: #14171c; --surface-2: #1b1f26;
    --text: #e8eaed; --muted: #9aa3af; --faint: #6b7280; --line: #242932;
    --accent: #60a5fa;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    --paper: #a78bfa; --model: #60a5fa; --repo: #fbbf24;
    --discussion: #22d3ee; --article: #4ade80; --video: #f87171;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: env(safe-area-inset-bottom);
}

header {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
}
.bar { display: flex; align-items: center; gap: 10px; max-width: 720px; margin: 0 auto; }
/* Stacked, because "Tributary" plus a status line plus three tabs does not fit
   across a phone -- and wrapped mid-sentence it reads as a bug rather than a
   subtitle. */
.brand {
  display: flex; flex-direction: column; margin-right: auto; min-width: 0;
  font-weight: 650; letter-spacing: -.02em; font-size: 17px; line-height: 1.25;
  /* Truncates rather than pushing the tabs off the screen: four tabs and an
     avatar leave the wordmark whatever is left, which on a narrow phone is
     not much. */
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.brand #count {
  color: var(--faint); font-weight: 400; font-size: 12.5px; letter-spacing: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tabs {
  display: flex; gap: 2px; background: var(--surface-2); padding: 3px;
  border-radius: 10px; flex: none;
}
.tab {
  border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px;
  padding: 5px 11px; border-radius: 8px; cursor: pointer; font-weight: 500;
}
.tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

/* Topic filters. A scrolling row rather than a wrapping one: the header is
   sticky, and a wrapped row would eat the screen on a phone as topics grow. */
.filters {
  display: flex; gap: 6px; max-width: 720px; margin: 10px auto 0;
  overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.filters::-webkit-scrollbar { display: none; }
.filters:empty { display: none; }
.filter {
  flex: none; font: inherit; font-size: 12.5px; font-weight: 550; cursor: pointer;
  padding: 5px 11px; border-radius: 999px; white-space: nowrap;
  border: 1px solid var(--line); background: var(--surface); color: var(--muted);
}
.filter[aria-pressed="true"] {
  background: var(--accent); border-color: var(--accent); color: #fff;
}
.filter .n { opacity: .6; margin-left: 5px; font-variant-numeric: tabular-nums; }
/* Shown only when something is on, in the slot the old "All" chip held. A
   chip that means "nothing is filtered" is just a statement of the row's own
   state; one that undoes a choice is a control. */
.filter.clear-all {
  color: var(--faint); border-style: dashed;
}
.filter.clear-all::before { content: '\00d7'; margin-right: 5px; font-size: 13px; }
.search {
  display: block; width: 100%; max-width: 720px; margin: 8px auto 0;
  font: inherit; font-size: 14px; color: var(--text);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 12px; -webkit-appearance: none;
}
.search::placeholder { color: var(--faint); }
.search:focus { outline: none; border-color: var(--accent); }

main { max-width: 720px; margin: 0 auto; padding: 14px 14px 80px; }

/* The digest is a page of subjects, not of news: the feed's filter rows and
   its search would both be answering a question nobody asked here. Scoped to
   the header, because the profile chooser's name field is a `.search` too and
   an unscoped rule hid it -- so a profile could not be added from this tab. */
body.digest-view > header .filters,
body.digest-view > header .search { display: none; }

/* A subject, what is unread in it, and the one control that matters. Framed
   rather than carded: these are shelves, and a shelf that looks like a story
   invites you to read it instead of choosing it. */
.digest {
  border-top: 1px solid var(--line); padding: 14px 2px 16px;
}
.digest.on { border-left: 2px solid var(--accent); padding-left: 12px; }
.digest-head { display: flex; align-items: baseline; gap: 10px; }
.digest-name {
  font: inherit; font-size: 17px; font-weight: 650; letter-spacing: -.015em;
  color: var(--text); background: none; border: 0; padding: 0; text-align: left;
  cursor: pointer; flex: 1;
}
.digest-name.as-text { cursor: default; color: var(--muted); font-size: 14px; }
.digest-count { color: var(--faint); font-size: 12.5px; margin-top: 3px; }
.digest-count strong { color: var(--accent); font-weight: 650; }
.digest-lead {
  display: block; margin-top: 8px; font: inherit; font-size: 14px; line-height: 1.4;
  color: var(--muted); background: none; border: 0; padding: 0; text-align: left;
  cursor: pointer;
}
.digest-leaves { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.digest-intro { color: var(--muted); font-size: 13.5px; margin: 2px 2px 4px; }
.digest-note { color: var(--faint); font-size: 12.5px; margin: 4px 0 0; line-height: 1.45; }

/* `min-width` because the label carries the state: Follow and Following are
   different lengths, and a button that resizes as you tap it moves the row
   under your thumb. Every app that ships this pins the width instead. */
.follow {
  font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
  padding: 5px 11px; border-radius: 999px; white-space: nowrap; min-width: 86px;
  background: var(--surface-2); color: var(--muted); border: 1px solid transparent;
}
.follow.on { background: var(--accent); color: #fff; }

/* A leaf, a name, a quiet follow: each of these opens its subject, and the
   tint says whether you follow it. Following moved into the panel that opens,
   because a chip that both navigates and follows is one control wearing two
   jobs, told apart only by a colour. */
.leaf {
  font: inherit; font-size: 12px; cursor: pointer; padding: 5px 10px;
  border-radius: 999px; background: var(--surface-2); color: var(--text);
  border: 1px solid transparent;
}
.leaf.on { background: var(--accent); color: #fff; }
.leaf .n { opacity: .6; margin-left: 5px; font-variant-numeric: tabular-nums; }

.active { color: var(--accent); font-size: 11.5px; }

/* Trending is the old ranking, still being judged. The mark is on the tab
   rather than in a banner: it belongs to the tab, and a banner above the feed
   would be read as a fault. */
.beta {
  font-size: 8.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
  vertical-align: super; margin-left: 3px; opacity: .65;
}
.note {
  color: var(--faint); font-size: 12.5px; margin: 0 2px 12px; line-height: 1.45;
}

/* Whose feed this is. A quiet initial rather than a name: the header is small,
   and the only question it has to answer at a glance is "am I me". */
.who {
  flex: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
  font: inherit; font-size: 13px; font-weight: 650; line-height: 1;
  background: var(--surface-2); color: var(--muted); border: 1px solid var(--line);
}
.who:empty { display: none; }
.profile-row {
  display: flex; align-items: center; gap: 8px;
  border-top: 1px solid var(--line); padding: 4px 0;
}
.profile-pick {
  flex: 1; font: inherit; font-size: 16px; font-weight: 600; text-align: left;
  color: var(--text); background: none; border: 0; padding: 12px 2px; cursor: pointer;
}
.profile-row.on .profile-pick { color: var(--accent); }
.profile-here { color: var(--faint); font-size: 11.5px; padding-right: 6px; }
.profile-new { display: flex; gap: 8px; align-items: center; margin-top: 16px; }
/* The list of what this profile follows, on the surface that is about this
   profile. Reddit keeps "Your communities" in the drawer behind the avatar and
   X keeps "Topics" in the profile menu: both put what you follow on the
   identity surface rather than in the feed. */
.profile-follows { margin-top: 4px; }
.profile-follows .subject-row:last-child { border-bottom: 1px solid var(--line); }
.profile-new .search { margin: 0; flex: 1; }

/* Trending's whole filter state, as one line you read rather than four rows of
   chips you scan past. */
.filters.scope { margin-top: 8px; gap: 6px; }
.scopebar {
  font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap;
  padding: 7px 13px; border-radius: 999px; color: var(--muted);
  background: var(--surface); border: 1px solid var(--line);
}
.scopebar.on { color: #fff; background: var(--accent); border-color: var(--accent); }
.scopebar .caret { margin-left: 6px; opacity: .7; font-size: 10px; }
.scopebar.clear-all { color: var(--faint); }

.sheet-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
/* One shelf per line, and its rows only once it is opened: ten names you read
   at a glance instead of forty chips you scan past. */
.sheet-shelf {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  padding: 9px 0; border-top: 1px solid var(--line);
}
.leaf.shelf { font-weight: 650; font-size: 13px; background: var(--surface-2); }
.leaf.shelf .caret {
  display: inline-block; margin-left: 6px; font-size: 9px; opacity: .55;
  transition: transform .15s ease;
}
.sheet-shelf.open .leaf.shelf .caret { transform: rotate(180deg); }
/* Set back under the shelf that owns them, on their own line, so the two
   levels read as levels rather than as one long row. */
.sheet-leaves {
  flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px;
  padding: 2px 0 2px 12px;
}
.linkish {
  font: inherit; color: var(--accent); background: none; border: 0;
  cursor: pointer; text-decoration: underline; padding: 0; margin-top: 8px;
}

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 15px; margin-bottom: 10px; box-shadow: var(--shadow);
  cursor: pointer; transition: transform .12s ease, opacity .2s ease;
}
.card:active { transform: scale(.992); }
.card.gone { opacity: 0; transform: scale(.96); }
.card.seen .title { color: var(--muted); }

.meta { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; flex-wrap: wrap; }
.badge {
  font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .055em;
  padding: 2.5px 7px; border-radius: 5px; color: #fff; white-space: nowrap;
}
.when { color: var(--faint); font-size: 12.5px; }
.src { color: var(--muted); font-size: 12.5px; }
.title {
  font-size: 16.5px; font-weight: 600; line-height: 1.34; letter-spacing: -.011em;
  margin: 0 0 6px;
}
.summary {
  color: var(--muted); font-size: 14px; line-height: 1.52; margin: 0;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
/* min-width:0 lets the text column shrink, without which the clamp above
   never engages and the thumbnail gets squeezed to nothing instead. */
.row { display: flex; gap: 12px; align-items: flex-start; }
.row .text { flex: 1; min-width: 0; }
.thumb {
  width: 76px; height: 76px; flex: none; display: block;
  border-radius: 10px; object-fit: cover; background: var(--surface-2);
}
.signal {
  margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line);
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  font-size: 12.5px; color: var(--faint);
}
.signal b { color: var(--accent); font-weight: 600; }
/* The wake of a story -- what it set off -- coloured by role. --c is set per
   chip, so one rule covers every role and the palette stays in :root. */
.chip {
  font-size: 11.5px; font-weight: 600; line-height: 1.55; white-space: nowrap;
  padding: 2px 8px; border-radius: 999px;
  color: var(--c, var(--muted));
  background: color-mix(in srgb, var(--c, var(--muted)) 13%, transparent);
  border: 1px solid color-mix(in srgb, var(--c, var(--muted)) 26%, transparent);
}
.chip.eng { --c: var(--accent); font-variant-numeric: tabular-nums; }
.actions { margin-left: auto; display: flex; gap: 4px; }
.icon {
  border: 0; background: transparent; color: var(--faint); font-size: 15px;
  padding: 4px 7px; border-radius: 7px; cursor: pointer; line-height: 1;
}
.icon:hover { background: var(--surface-2); color: var(--text); }
.icon.on { color: var(--accent); }

/* Story detail */
.sheet {
  position: fixed; inset: 0; z-index: 40; background: var(--bg);
  overflow-y: auto; overscroll-behavior: contain;
  transform: translateY(100%); transition: transform .26s cubic-bezier(.32,.72,0,1);
  padding-bottom: calc(env(safe-area-inset-bottom) + 40px);
}
.sheet.open { transform: translateY(0); }
.sheet-bar {
  position: sticky; top: 0; background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top) + 6px) 12px 6px; display: flex; gap: 4px;
}
/* A 44px target: the feed's icon buttons are sized for a corner of a card, and
   at that size this one was the hardest thing on the page to hit. */
.sheet-bar .icon {
  min-width: 44px; min-height: 44px; font-size: 20px;
  display: flex; align-items: center; justify-content: center;
}
/* Stacked panels look identical from the bar down, and a stack of identical
   layers is what makes nesting disorienting. A pushed page names itself, so
   this one does too. */
.sheet-where {
  align-self: center; font-size: 13px; font-weight: 600; color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
}
.sheet-body { max-width: 720px; margin: 0 auto; padding: 18px 16px; }
.sheet h1 { font-size: 22px; line-height: 1.25; letter-spacing: -.02em; margin: 0 0 12px; }
.sheet-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sheet-clear { flex: none; margin-top: 0; font-size: 13px; }
.hero {
  display: block; width: 100%; height: 190px; object-fit: cover;
  border-radius: 12px; background: var(--surface-2); margin-bottom: 16px;
}
.abstract { color: var(--muted); font-size: 15px; line-height: 1.6; margin: 0 0 22px; }
.group-label {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em;
  color: var(--faint); margin: 20px 0 8px;
}
.item {
  display: block; text-decoration: none; color: inherit;
  background: var(--surface); border: 1px solid var(--line); border-radius: 11px;
  padding: 12px 13px; margin-bottom: 7px;
}
.item-title { font-size: 14.5px; font-weight: 550; line-height: 1.38; margin-bottom: 4px; }
.item-summary {
  color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0 0 5px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.item-meta { font-size: 12.5px; color: var(--faint); }
.item-meta .eng { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }

/* --- A subject, opened ------------------------------------------------------
   Shaped like a profile page, which is what was asked for: the name and the
   follow control together at the top, then what is under it, then what is in
   it. The follow is a real button rather than a chip's tint, because "clear
   what is followed" is the whole point of the panel. */
.subject-where {
  font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--faint);
  font-family: inherit; background: none; border: 0; padding: 0; cursor: pointer;
}
.subject-where::after { content: ' \203a'; }
.subject-title {
  font-size: 26px; font-weight: 700; letter-spacing: -.025em;
  line-height: 1.15; margin: 4px 0 0;
}
.subject-stat { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
.subject-stat strong { color: var(--accent); font-weight: 650; }
.subject-actions { display: flex; gap: 8px; margin: 16px 0 4px; }
/* Full width and side by side: on a phone these are the two things the panel
   is for, and a pill in a corner does not read as the answer to "do I follow
   this". Accent still means "you follow this" -- outlined is the offer, filled
   is the state -- so the language is the same as the chips elsewhere while the
   button is still the loudest thing under the name. */
.follow.wide, .subject-go {
  flex: 1; font-size: 14px; padding: 11px 14px; border-radius: 12px;
}
.follow.wide {
  background: transparent; color: var(--accent); border-color: var(--accent);
}
.follow.wide.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.subject-go {
  font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  background: var(--surface-2); color: var(--text); border: 1px solid var(--line);
}
/* A leaf is a row rather than a chip, so its name and its follow are two
   separate targets. As a chip they were one control that both navigated and
   followed, told apart only by a tint. */
.subject-row {
  display: flex; align-items: center; gap: 10px;
  border-top: 1px solid var(--line); padding: 10px 2px;
}
.subject-leaf {
  flex: 1; font: inherit; font-size: 14.5px; font-weight: 550; text-align: left;
  color: var(--text); background: none; border: 0; padding: 0; cursor: pointer;
}
.subject-leaf .n { color: var(--faint); font-weight: 400; margin-left: 6px;
  font-variant-numeric: tabular-nums; }
.subject-leaf .new { color: var(--accent); font-weight: 650; }
.headline {
  display: block; width: 100%; font: inherit; font-size: 14.5px; line-height: 1.4;
  text-align: left; color: var(--text); background: none; cursor: pointer;
  border: 0; border-top: 1px solid var(--line); padding: 11px 2px;
}
.headline.seen { color: var(--faint); }
.headline .when { color: var(--faint); font-size: 12.5px; }
.subject-none { color: var(--faint); font-size: 13px; margin: 18px 0 0; }
/* A row that completes the arithmetic rather than offering a choice: parked
   stories are not a subtopic, so there is nothing here to open or follow. */
.subject-leaf.as-text { cursor: default; color: var(--muted); font-weight: 550; }
.subject-note { color: var(--faint); font-size: 12.5px; line-height: 1.45; margin: 8px 2px 0; }

/* A topic is a place you are in, not a setting you have on. */
.topic-head {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 15px; margin-bottom: 10px; box-shadow: var(--shadow);
}
.topic-name { font-size: 17px; font-weight: 650; letter-spacing: -.015em; }
/* Each segment is a button, so the line still reads as a name rather than as
   controls: same size and weight as the text it replaced, with the ancestor
   muted the way a breadcrumb's ancestors are. */
.crumb {
  font: inherit; font-size: inherit; font-weight: inherit; letter-spacing: inherit;
  color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer;
  text-align: left;
}
.crumb.here { color: var(--text); }
.crumb-sep { color: var(--faint); }
.topic-meta { color: var(--faint); font-size: 12.5px; margin-top: 2px; }
/* The follow control sits under the name rather than beside it: the name wraps
   on a phone, and a button sharing that line would be squeezed to nothing. */
.head-follow { margin-top: 10px; }

.sheet-topics { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 16px; }
/* Who a story is about. Neutral, because an entity is a door into a different
   cut of the feed, not a statement about this story's subject. */
.entity-link {
  --c: var(--text); cursor: pointer; font-family: inherit;
  font-size: 12px; padding: 4px 10px;
}
/* The subject leads the signal row, in the accent the page uses for a place
   you can walk into -- the same colour the story detail gives its topic chip.
   Names beside it stay neutral: an entity is a different cut of the feed, not
   where this story lives. */
.topic-chip { --c: var(--accent); cursor: pointer; font-family: inherit; }
.ents { display: inline-flex; gap: 4px; min-width: 0; overflow: hidden; }
.ents .chip { --c: var(--muted); cursor: pointer; font-family: inherit; font-weight: 550; }
.head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.clear {
  border: 1px solid var(--line); background: var(--surface-2); color: var(--muted);
  font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 999px; cursor: pointer;
}
.topic-link {
  --c: var(--accent); cursor: pointer; font-family: inherit;
  font-size: 12px; padding: 4px 10px;
}

.empty { text-align: center; color: var(--muted); padding: 64px 20px; }
.empty code {
  background: var(--surface-2); padding: 2px 7px; border-radius: 5px;
  font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.spinner {
  width: 22px; height: 22px; margin: 60px auto; border-radius: 50%;
  border: 2.5px solid var(--line); border-top-color: var(--accent);
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.health {
  color: var(--faint); font-size: 12px; text-align: center;
  margin: 18px 0 0; padding: 0 8px;
}
/* Phone widths, last so these win over the base rules they narrow. The
   wordmark is the one thing in the top row nobody needs: four tabs and an
   avatar leave it a truncated "Trib", while the line below it still says
   whether the feed is fresh. */
@media (max-width: 460px) {
  .wordmark { display: none; }
  .brand #count { font-size: 13px; }
  .tab { padding: 5px 8px; font-size: 12.5px; }
  .bar { gap: 8px; }
  .beta { margin-left: 2px; }
}

@media (prefers-reduced-motion: reduce) {
  *, .sheet { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand"><span class="wordmark">Tributary</span><span id="count"></span></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="feed" aria-selected="true">Feed</button>
      <button class="tab" role="tab" data-view="trending" aria-selected="false"
        >Trending<span class="beta">beta</span></button>
      <button class="tab" role="tab" data-view="topics" aria-selected="false">Topics</button>
      <button class="tab" role="tab" data-view="saved" aria-selected="false">Saved</button>
    </div>
    <button class="who" id="who" aria-label="Switch profile"></button>
  </div>
  <div class="filters" id="filters"></div>
  <div class="filters scope" id="scopes"></div>
  <input id="search" class="search" type="search" autocomplete="off"
    placeholder="Search titles and summaries" aria-label="Search stories">
</header>

<main id="main"><div class="spinner"></div></main>

<div class="sheet" id="filter-sheet" role="dialog" aria-modal="true" aria-label="Filters">
  <div class="sheet-bar">
    <button class="icon" id="close-filters" aria-label="Back">&larr;</button>
  </div>
  <div class="sheet-body" id="filter-body"></div>
</div>

<div class="sheet" id="subject-sheet" role="dialog" aria-modal="true" aria-label="Subject">
  <div class="sheet-bar">
    <button class="icon" id="close-subject" aria-label="Back">&larr;</button>
    <span class="sheet-where" id="subject-where"></span>
  </div>
  <div class="sheet-body" id="subject-body"></div>
</div>

<div class="sheet" id="profiles" role="dialog" aria-modal="true" aria-label="Profiles">
  <div class="sheet-bar">
    <button class="icon" id="close-profiles" aria-label="Back">&larr;</button>
  </div>
  <div class="sheet-body" id="profile-body"></div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Story detail">
  <div class="sheet-bar">
    <button class="icon" id="close" aria-label="Back">&larr;</button>
    <button class="icon" id="save-detail" aria-label="Save">&#9734;</button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<script>
/* The page reads one bundle, whether a live server built it or a scheduled job
   wrote it to disk. That is what lets the same file run under FastAPI at home
   and as a static site on GitHub Pages with no build step and no second
   frontend. Per-device state (seen, saved, dismissed) lives in localStorage
   because it is a preference, not data -- and because a static host has nowhere
   to put it. When a server is present the same actions are also POSTed, so the
   CLI's notion of "seen" stays in step. */
const KINDS = {
  paper: 'var(--paper)', model: 'var(--model)', repo: 'var(--repo)',
  video: 'var(--video)', discussion: 'var(--discussion)',
  article: 'var(--article)', post: 'var(--article)',
};
/* One word per kind, for the badge on a card and for the chips counting what
   else is attached to it -- which is what each item *is*, not the role it
   plays in the narrative (role says "repo" for a model, since both are things
   built on a story). These were two tables and they drifted: the same kind was
   badged `news` and counted as `1 article` on one card, and `code` against
   `1 repo` on the next. A reader has no way to know those are the same thing.
   The order here is the order the chips appear in. */
const KIND_WORD = {
  paper: 'paper', model: 'model', repo: 'repo', video: 'video',
  discussion: 'discussion', article: 'article', post: 'post',
};
const main = document.getElementById('main');
const sheet = document.getElementById('sheet');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* --- Profiles --------------------------------------------------------------
   Not a login, and the page never pretends otherwise: there is no password,
   nothing is private, and a profile is a namespace over the keys this device
   already stores. Two people sharing a phone get their own follows, their own
   unread counts and their own saved list; the same name on a laptop is a
   different profile, because there is no server to sync to and a static host
   has nowhere to put one. */
const readList = (name) => {
  try { return JSON.parse(localStorage.getItem(name) || '[]'); } catch { return []; }
};
let profiles = readList('profiles');
let profile = localStorage.getItem('profile') || '';

// Namespaced per profile, so switching swaps every mark at once.
const key = (name) => (profile ? `p:${profile}:${name}` : name);

let view = 'feed';
let topic = '';
/* Trending is the old ranking, kept off the default feed. Its scope is not
   persisted: which half of it you were last in is not worth remembering. */
let trendScope = 'all';
let query = '';   // deliberately not persisted: a stale search on open is a bug
/* Not persisted either. An entity is a place, but one reached from a story --
   landing back in it days later would be disorienting. */
let entity = '';
/* Which shelf is open in Trending's filter sheet. One at a time, and set from
   the current selection every time the sheet opens, so it is a view of where
   you are rather than a preference of its own. */
let openShelf = '';
let bundle = null;
let current = null;
let hasServer = true;   // set false on the first failed POST

const readSet = (name) => {
  try { return new Set(JSON.parse(localStorage.getItem(key(name)) || '[]')); }
  catch { return new Set(); }
};
const store = (name, value) => {
  try { localStorage.setItem(name, value); } catch { /* private mode */ }
};
const writeSet = (name, set) => {
  try { localStorage.setItem(key(name), JSON.stringify([...set])); }
  catch { /* private mode */ }
};

/* What you follow, as `topic:<slug>` and `entity:<name>`. A preference, so it
   lives beside seen and saved rather than in the bundle -- and following
   nothing means an empty feed, because a feed that is full before you have
   chosen anything is the habit this project is replacing. */
const marks = { seen: new Set(), saved: new Set(), dismissed: new Set() };
let follows = new Set();
const followed = (name) => follows.has(name);

/* Everything the active profile owns, re-read in place. Switching profiles
   must not reload the bundle: it is the same news, read by someone else. */
function loadProfileState() {
  marks.seen = readSet('seen');
  marks.saved = readSet('saved');
  marks.dismissed = readSet('dismissed');
  follows = readSet('follows');
  view = localStorage.getItem(key('view')) || 'feed';
  topic = localStorage.getItem(key('topic')) || '';
  trendScope = 'all';
  entity = '';
  document.querySelectorAll('.tab').forEach((t) =>
    t.setAttribute('aria-selected', String(t.dataset.view === view)));
}

function toggleFollow(name) {
  if (follows.has(name)) follows.delete(name); else follows.add(name);
  writeSet('follows', follows);
}

/* The first profile inherits whatever this device already stored, so turning
   profiles on does not silently wipe the follows someone has been building.
   Runs once: after it, `profiles` is non-empty and the branch is dead. */
function adoptLegacyState(name) {
  for (const old of ['seen', 'saved', 'dismissed', 'follows', 'view', 'topic']) {
    const value = localStorage.getItem(old);
    if (value === null) continue;
    try {
      localStorage.setItem(`p:${name}:${old}`, value);
      localStorage.removeItem(old);
    } catch { /* private mode */ }
  }
}

function addProfile(name) {
  name = name.trim().slice(0, 24);
  if (!name || profiles.includes(name)) return name || '';
  const first = !profiles.length;
  profiles = [...profiles, name];
  store('profiles', JSON.stringify(profiles));
  if (first) adoptLegacyState(name);
  return name;
}

function useProfile(name) {
  profile = name;
  store('profile', name);
  loadProfileState();
  closeProfiles();
  render();
  window.scrollTo({ top: 0 });
}

function removeProfile(name) {
  profiles = profiles.filter((p) => p !== name);
  store('profiles', JSON.stringify(profiles));
  for (const owned of ['seen', 'saved', 'dismissed', 'follows', 'view', 'topic']) {
    try { localStorage.removeItem(`p:${name}:${owned}`); } catch { /* private mode */ }
  }
  renderProfiles();
}

/* Everything this profile follows, counted in the bundle. Asked for
   2026-09-21: *"In the profiles, I would also like to see the topics i
   follow"* -- and it is where the apps this borrows from keep it. Reddit's
   "Your communities" lives in the drawer behind the avatar; X keeps "Topics"
   in the profile menu. A follow is a property of whoever is reading, and the
   chooser is the only surface that is about them.

   Rows are drawn from a snapshot taken when the chooser opened, not from the
   live set, so unfollowing leaves the row in place with `Follow` on it. A row
   that vanishes under the thumb that tapped it gives you nothing to undo with.
*/
let followsShown = null;

function followRows() {
  const live = bundle ? bundle.stories.filter((s) => !marks.dismissed.has(s.story_id)) : [];
  const keys = new Set([...follows, ...(followsShown || [])]);
  return [...keys].map((k) => {
    const topical = k.startsWith('topic:');
    const id = k.slice(topical ? 6 : 7);
    return {
      key: k,
      name: topical ? topicName(id) : id,
      unseen: live.filter((s) => (topical ? hasTopic(s, id) : hasEntity(s, id))
        && !marks.seen.has(s.story_id)).length,
      n: live.filter((s) => (topical ? hasTopic(s, id) : hasEntity(s, id))).length,
    };
  }).sort((a, b) => b.n - a.n || a.name.localeCompare(b.name));
}

function followsHTML() {
  const rows = followRows();
  if (!rows.length) {
    return `<div class="group-label">Following</div>
      <p class="note">Nothing yet. Your feed stays empty until you follow
        something &mdash; <button class="linkish" data-view-jump="topics"
        >pick some subjects</button>.</p>`;
  }
  return `<div class="group-label">Following ${rows.length}</div>
    <div class="profile-follows">${rows.map((row) => {
      const on = followed(row.key);
      return `<div class="subject-row">
        <button class="subject-leaf" data-subject="${esc(row.key)}">${esc(row.name)}<span
          class="n">${leafCount(row)}</span></button>
        <button class="follow${on ? ' on' : ''}" data-follow="${esc(row.key)}"
          aria-pressed="${on}">${on ? 'Following' : 'Follow'}</button>
      </div>`;
    }).join('')}</div>`;
}

function renderProfiles() {
  const list = profiles.map((name) => `
    <div class="profile-row${name === profile ? ' on' : ''}">
      <button class="profile-pick" data-use="${esc(name)}">${esc(name)}</button>
      ${name === profile ? '<span class="profile-here">here</span>'
        : `<button class="icon" data-drop="${esc(name)}" aria-label="Remove ${esc(name)}"
            >&times;</button>`}
    </div>`).join('');

  document.getElementById('profile-body').innerHTML = `
    <h1>Who is reading?</h1>
    <p class="note">A name, nothing else &mdash; no password, and nothing here is
      private. Profiles keep their own follows, unread counts and saved stories
      on this device only.</p>
    ${list || '<p class="note">No profiles yet.</p>'}
    <form id="new-profile" class="profile-new" autocomplete="off">
      <input id="profile-name" class="search" type="text" maxlength="24"
        placeholder="New profile name" aria-label="New profile name">
      <button class="follow on" type="submit">Add</button>
    </form>
    ${profile ? followsHTML() : ''}`;
}

function openProfiles() {
  followsShown = new Set(follows);
  renderProfiles();
  document.getElementById('profiles').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeProfiles() {
  document.getElementById('profiles').classList.remove('open');
  document.body.style.overflow = '';
}

/* Following a shelf follows everything on it, the same way filtering does. */
function isFollowed(s) {
  for (const t of s.topics || []) {
    if (follows.has(`topic:${t.slug}`)) return true;
    if (t.parent && follows.has(`topic:${t.parent}`)) return true;
  }
  return (s.entities || []).some((e) => follows.has(`entity:${e.name}`));
}

function mark(kind, id, on) {
  if (on) marks[kind].add(id); else marks[kind].delete(id);
  writeSet(kind, marks[kind]);
  if (on && hasServer) {
    /* Not per profile. The POST exists so the CLI's notion of "seen" stays in
       step for whoever runs `trib serve` locally, and `interactions` has no
       column for a person. So on a local server every profile's marks land in
       one bucket; on GitHub Pages, where there is no server, this never fires
       and the profiles are cleanly separate. */
    const action = kind === 'seen' ? 'seen' : kind;
    fetch(`/api/story/${id}/${action}`, { method: 'POST' }).catch(() => { hasServer = false; });
  }
}

function ago(iso) {
  if (!iso) return '';
  const mins = (Date.now() - new Date(iso)) / 6e4;
  if (mins < 60) return `${Math.max(1, Math.round(mins))}m`;
  if (mins < 1440) return `${Math.round(mins / 60)}h`;
  const days = Math.round(mins / 1440);
  return days < 7 ? `${days}d`
    : new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

const plural = (n, word) =>
  `${n} ${n === 1 ? word : word.endsWith('y') ? word.slice(0, -1) + 'ies' : word + 's'}`;

/* Votes and replies: the measure of how much argument a story actually drew. */
function engagement(counts) {
  if (!counts) return '';
  const parts = [];
  if (counts.points) parts.push(`&#9650; ${esc(counts.points)}`);
  if (counts.comments) parts.push(plural(esc(counts.comments), 'comment'));
  return parts.join(' · ');
}

function chipsHTML(s) {
  const counts = {};
  for (const item of s.items || []) counts[item.kind] = (counts[item.kind] || 0) + 1;
  // The headline is already the card; the chips are what else came with it.
  if (counts[s.kind]) counts[s.kind] -= 1;

  const chips = Object.entries(KIND_WORD)
    .filter(([kind]) => counts[kind])
    .map(([kind, word]) =>
      `<span class="chip" style="--c:${KINDS[kind]}">${
        plural(counts[kind], word)}</span>`);

  if ((s.sources || []).length > 1) {
    chips.push(`<span class="chip">${plural(s.sources.length, 'source')}</span>`);
  }
  const drew = engagement(s.engagement);
  if (drew) chips.push(`<span class="chip eng">${drew}</span>`);
  return chips.join('');
}

/* The feed orders by when the news broke, so a story that has grown since says
   so on its own card rather than by jumping the queue. Six hours, because an
   arXiv paper and its own announcement land minutes apart and that is one
   event, not a story with a wake. */
function stillMoving(s) {
  if (!s.last_activity || !s.published_at) return false;
  return new Date(s.last_activity) - new Date(s.published_at) > 6 * 36e5;
}

/* Where a story lives, on the card. Reported 2026-09-21: *"it is a bit strange
   that e.g. the openai tag shows but you cannot see industry and policy until
   you click on the news"* -- the card carried who a story was about and not
   where it sat, so the one axis that decides what your feed holds was the one
   you had to open a story to see. Under one home there is exactly one, and a
   parked story names its shelf, so this is always one chip. It leads the row
   because it is the strongest thing on it, and it opens its subject like every
   other name on the page. */
function topicChip(s) {
  const label = (s.topics || [])[0];
  if (!label) return '';
  return `<button class="chip topic-chip" data-subject="topic:${esc(label.slug)}"
    >${esc(label.name)}</button>`;
}

function cardHTML(s) {
  const colour = KINDS[s.kind] || 'var(--muted)';
  const label = KIND_WORD[s.kind] || s.kind;
  const isSaved = marks.saved.has(s.story_id);
  const isSeen = marks.seen.has(s.story_id);
  return `
  <article class="card${isSeen ? ' seen' : ''}" data-id="${s.story_id}">
    <div class="meta">
      <span class="badge" style="background:${colour}">${esc(label)}</span>
      <span class="src">${esc(s.source)}</span>
      <span class="when">${esc(ago(s.published_at))}</span>
      ${stillMoving(s) ? `<span class="active">active ${
        esc(ago(s.last_activity))}</span>` : ''}
    </div>
    <div class="row">
      <div class="text">
        <h2 class="title">${esc(s.title)}</h2>
        ${s.summary ? `<p class="summary">${esc(s.summary)}</p>` : ''}
      </div>
      ${s.media_url ? `<img class="thumb" src="${esc(s.media_url)}" alt=""
        loading="lazy" referrerpolicy="no-referrer">` : ''}
    </div>
    <div class="signal">
      ${topicChip(s)}
      ${chipsHTML(s)}
      ${(s.entities || []).length ? `<span class="ents">${
        s.entities.slice(0, 2).map((e) =>
          `<button class="chip" data-subject="entity:${esc(e.name)}"
            >${esc(e.name)}</button>`).join('')
      }</span>` : ''}
      <span class="actions">
        <button class="icon${isSaved ? ' on' : ''}" data-act="saved" title="Save"
          >${isSaved ? '&#9733;' : '&#9734;'}</button>
        <button class="icon" data-act="dismissed" title="Dismiss">&times;</button>
      </span>
    </div>
  </article>`;
}

/* A story is on a shelf if it carries that topic or any topic under it, so
   selecting "AI models" keeps everything filed under "Open weights" too. */
const hasTopic = (s, slug) =>
  (s.topics || []).some((t) => t.slug === slug || t.parent === slug);

/* Every shelf a story sits on: its parents, plus any topic that has none.
   Deduplicated, because a story that matched both "AI models" and its child
   "Research" belongs to that shelf once, not twice. */
function shelvesOf(s) {
  const shelves = new Map();
  for (const t of s.topics || []) {
    const shelf = t.parent ? { slug: t.parent, name: t.parent_name } : { slug: t.slug, name: t.name };
    if (!shelves.has(shelf.slug)) shelves.set(shelf.slug, shelf);
  }
  return [...shelves.values()];
}

/* Searches the story and everything attached to it, so a paper found by the
   title of the thread arguing about it still comes back. */
function matches(s, needle) {
  const hay = [s.title, s.summary, s.source, ...(s.topics || []).map((t) => t.name),
    ...(s.entities || []).map((e) => e.name),
    ...(s.items || []).flatMap((i) => [i.title, i.source])];
  return hay.some((text) => text && text.toLowerCase().includes(needle));
}

/* Newest first, by the date on the card. Deliberately not the date the ranking
   uses: a story's clock restarts when its wake grows, and a chronological feed
   where a three-day-old paper jumps the queue because someone commented is the
   feed that looked unsorted in the first place. The wake still shows, as
   "active 2h" on the card -- it just does not reorder anything. */
const byDate = (list) =>
  [...list].sort((a, b) => (b.published_at || '').localeCompare(a.published_at || ''));

function visible() {
  let all = bundle.stories.filter((s) => !marks.dismissed.has(s.story_id));
  all = scoped(all);
  // Search cuts across the tabs: looking for something you saved weeks ago
  // should not depend on which tab you left selected.
  if (query) return byDate(all.filter((s) => matches(s, query)));
  if (view === 'saved') return byDate(all.filter((s) => marks.saved.has(s.story_id)));

  // Trending is the ranking this feed used to be: relevance, decayed by age,
  // nudged by how many sources bothered. It is a place you go, not the default.
  if (view === 'trending') {
    const pool = trendScope === 'mine' && follows.size ? all.filter(isFollowed) : all;
    return [...pool].sort((a, b) => b.score - a.score);
  }
  /* Follows decide what the *unscoped* feed holds. A topic or an entity you
     walked into is a place, and a place shows what is in it -- requiring a
     follow as well emptied every subject you had not already chosen, which is
     exactly the subject you went to look at. */
  return byDate(topic || entity ? all : all.filter(isFollowed));
}

const hasEntity = (s, name) => (s.entities || []).some((e) => e.name === name);

/* The place you are in: a topic, or an entity reached from a story. Never
   both -- "everything about OpenAI" is supposed to cut across topics. */
function scoped(stories) {
  if (entity) return stories.filter((s) => hasEntity(s, entity));
  if (topic) return stories.filter((s) => hasTopic(s, topic));
  return stories;
}

/* Built from the stories actually loaded, so a filter never leads to an empty
   feed and a topic nothing was written about this week simply does not appear. */
/* Every topic the loaded stories can be filtered by, by slug, so a selected
   slug can be resolved to the shelf it sits on.

   Shelves are in here too, not just the labels stories carry. A story has one
   home, and that home is usually a leaf, so a shelf is its own label only on
   the rare story that parked there. The top row offers a shelf regardless --
   and `render` clears any selection this index cannot resolve, which turned
   every unparked shelf into a chip that did nothing when you tapped it. */
function topicIndex(live) {
  const index = new Map();
  for (const story of live) {
    for (const label of story.topics || []) {
      if (!index.has(label.slug)) index.set(label.slug, label);
    }
    for (const shelf of shelvesOf(story)) {
      if (!index.has(shelf.slug)) index.set(shelf.slug, shelf);
    }
  }
  return index;
}

/* The subjects you follow, as ways into them. It cannot show a *lit* chip any
   more, because the row is gone the moment you are inside a subject -- so it
   carries no pressed state and no `Clear`: leaving is the banner's job now. */
const chipRow = (ranked) => ranked.map(([slug, { name, n }]) =>
  `<button class="filter" data-topic="${esc(slug)}"
    >${esc(name)}<span class="n">${n}</span></button>`).join('');

const narrowed = () => Boolean(topic || entity);

/* The subjects you follow, counted in the feed, in the order the digest ranks
   them. Flat, with no shelf-then-leaf step: you picked these individually, so
   nesting them again would be filing your own choices for you. */
function followedRow(live) {
  const counts = new Map();
  for (const story of live) {
    for (const label of story.topics || []) {
      for (const slug of [label.slug, label.parent]) {
        if (!slug || !follows.has(`topic:${slug}`)) continue;
        const name = slug === label.slug ? label.name : label.parent_name;
        const seen = counts.get(slug) || { name, n: 0 };
        seen.n += 1;
        counts.set(slug, seen);
      }
    }
  }
  return [...counts.entries()].sort((a, b) => b[1].n - a[1].n);
}

/* One row: the subjects you follow, because that is all the feed holds. There
   used to be a second row -- the whole spine, shelf then leaf -- for the case
   where you followed nothing and the feed was therefore everything. The feed
   is now empty until you follow something, so that case cannot happen and the
   row it needed has gone with it. */
/* Hidden while you are inside a subject. Reported 2026-09-21: *"it now shows
   the filters I follow even though i clicked on a topic"* -- and they were not
   filters on that place at all. Walking into `Industry & policy` left a row
   offering `Language models` and `AI agents`, neither of them in the feed
   below, neither of them lit, and the subject you were actually standing in
   missing from the row because you do not follow it. Tapping one would not
   narrow the place, it would leave it for a different one. A place carries its
   own chrome, which is the banner. */
function renderFilters(live) {
  const row = document.getElementById('filters');
  const mine = narrowed() || !follows.size ? [] : followedRow(live);
  row.innerHTML = mine.length ? chipRow(mine) : '';
}

/* --- The digest ------------------------------------------------------------
   Every subject in the bundle, what is new in it, and the one control that
   matters: whether you follow it. This is the page that answers "what happened"
   without scrolling a feed -- something you finish rather than something you
   fall into, which is the whole point of the project.

   "New" means unseen, not "since a timestamp": the seen marks are already per
   story and already per device, and a count you can clear by reading is more
   honest than one that resets itself at midnight. Counts are over the stories
   in the bundle, so they always match what tapping through actually shows. */
function digestRows(live) {
  const shelves = new Map();
  for (const story of live) {
    for (const label of story.topics || []) {
      const shelf = label.parent
        ? { slug: label.parent, name: label.parent_name }
        : { slug: label.slug, name: label.name };
      if (!shelves.has(shelf.slug)) {
        shelves.set(shelf.slug, { ...shelf, n: 0, unseen: 0, lead: null, leaves: new Map() });
      }
      const row = shelves.get(shelf.slug);
      row.n += 1;
      if (!marks.seen.has(story.story_id)) row.unseen += 1;
      if (!row.lead || (story.published_at || '') > (row.lead.published_at || '')) {
        row.lead = story;
      }
      if (!label.parent) continue;
      if (!row.leaves.has(label.slug)) {
        row.leaves.set(label.slug, { slug: label.slug, name: label.name, n: 0, unseen: 0 });
      }
      const leaf = row.leaves.get(label.slug);
      leaf.n += 1;
      if (!marks.seen.has(story.story_id)) leaf.unseen += 1;
    }
  }
  // Most unread first: the page exists to say where to look next, and a shelf
  // you have already read through has nothing to say however big it is.
  return [...shelves.values()].sort((a, b) => b.unseen - a.unseen || b.n - a.n);
}

function namesInPlay(live) {
  const counts = new Map();
  for (const story of live) {
    for (const entity of story.entities || []) {
      const seen = counts.get(entity.name) || { name: entity.name, kind: entity.kind, n: 0 };
      seen.n += 1;
      counts.set(entity.name, seen);
    }
  }
  return [...counts.values()].sort((a, b) => b.n - a.n).slice(0, 24);
}

const followButton = (key, on) =>
  `<button class="follow${on ? ' on' : ''}" data-follow="${esc(key)}"
    aria-pressed="${on}">${on ? 'Following' : 'Follow'}</button>`;

/* What to call a topic slug. The stories carry their own labels, so anything on
   screen can name itself; the spine is here for the ones that cannot -- a
   followed subject with nothing in this bundle. Falling back to the slug beats
   inventing a name from it, and only happens for a follow whose topic has since
   left the config. */
function topicName(slug) {
  const fromSpine = (bundle.spine || []).find((t) => t.slug === slug);
  if (fromSpine) return fromSpine.name;
  const fromStory = topicIndex(bundle.stories).get(slug);
  return fromStory ? fromStory.name : slug;
}

/* Everything you follow that this bundle has nothing to show for. Topics die by
   dormancy -- a quiet one simply stops appearing -- which is right for a filter
   row and wrong for a follow: the follow is still counted, still gates the
   feed, and had no row left to turn it off with. */
function quietFollows(shown) {
  return [...follows].filter((f) => !shown.has(f)).map((f) => ({
    key: f,
    name: f.startsWith('topic:') ? topicName(f.slice(6)) : f.slice(7),
  })).sort((a, b) => a.name.localeCompare(b.name));
}

function digestHTML(live) {
  const rows = digestRows(live);
  if (!rows.length) return '<div class="empty">Nothing labelled yet.</div>';

  const shelves = rows.map((row) => {
    const on = followed(`topic:${row.slug}`);
    const leaves = [...row.leaves.values()].sort((a, b) => b.unseen - a.unseen || b.n - a.n);
    return `
    <section class="digest${on ? ' on' : ''}">
      <div class="digest-head">
        <button class="digest-name" data-subject="topic:${esc(row.slug)}"
          >${esc(row.name)}</button>
        ${followButton(`topic:${row.slug}`, on)}
      </div>
      <div class="digest-count">${
        row.unseen === row.n ? `<strong>${plural(row.n, 'story')}</strong>, all new`
        : row.unseen ? `<strong>${row.unseen} new</strong> · ${plural(row.n, 'story')}`
        : `${plural(row.n, 'story')} · all read`}</div>
      ${row.lead ? `<button class="digest-lead" data-open="${row.lead.story_id}"
        >${esc(row.lead.title)}</button>` : ''}
      ${leaves.length ? `<div class="digest-leaves">${leaves.map((leaf) => `
        <button class="leaf${followed(`topic:${leaf.slug}`) ? ' on' : ''}"
          data-subject="topic:${esc(leaf.slug)}"
          >${esc(leaf.name)}<span class="n">${leaf.unseen || leaf.n}</span></button>`).join('')
      }</div>` : ''}
    </section>`;
  }).join('');

  const inPlay = namesInPlay(live);
  const names = inPlay.map((entity) => {
    const on = followed(`entity:${entity.name}`);
    return `<button class="leaf${on ? ' on' : ''}" data-subject="entity:${esc(entity.name)}"
      >${esc(entity.name)}<span class="n">${entity.n}</span></button>`;
  }).join('');

  // Everything this page has already given you a control for.
  const shown = new Set();
  for (const row of rows) {
    shown.add(`topic:${row.slug}`);
    for (const leaf of row.leaves.keys()) shown.add(`topic:${leaf}`);
  }
  for (const entity of inPlay) shown.add(`entity:${entity.name}`);

  const quiet = quietFollows(shown).map(({ key, name }) =>
    `<button class="leaf on" data-subject="${esc(key)}">${esc(name)}</button>`).join('');

  return `
    <p class="digest-intro">${follows.size
      ? `Your feed is the ${plural(follows.size, 'subject')} you follow. Tap one to open it.`
      : 'Your feed is empty until you follow something. Tap a subject to look inside it.'}</p>
    ${shelves}
    ${names ? `<section class="digest">
      <div class="digest-head"><span class="digest-name as-text">Names in play</span></div>
      <div class="digest-leaves">${names}</div>
    </section>` : ''}
    ${quiet ? `<section class="digest">
      <div class="digest-head"><span class="digest-name as-text">Followed, but quiet</span></div>
      <p class="digest-note">Nothing in the feed right now. They still count as
        subjects you follow &mdash; tap one to open it and stop.</p>
      <div class="digest-leaves">${quiet}</div>
    </section>` : ''}`;
}


/* The banner that makes an entity a place: everything that names it, across
   every topic, with a way back out. */
function entityHead(name, count) {
  const kind = (bundle.stories.flatMap((s) => s.entities || [])
    .find((e) => e.name === name) || {}).kind;
  return `<div class="topic-head"><div class="head-row"><div>
    <div class="topic-name">${esc(name)}</div>
    <div class="topic-meta">${kind ? esc(kind) + ' · ' : ''}${
      plural(count, 'story')} naming it, across every topic</div>
    </div><button class="clear" data-leave>Back to feed</button></div>
    <div class="head-follow">${followButton(`entity:${name}`, followed(`entity:${name}`))}</div>
    </div>`;
}

/* The banner that makes a topic a place rather than a filter setting -- and,
   since you are standing in it, the obvious place to decide whether it belongs
   in your feed. Following used to be reachable only from the digest, so the
   subject you were reading was the one subject you could not act on. */
/* The banner names where you are, and every part of that name is a way
   somewhere. Asked for 2026-09-21: *"I also want to be able to click on e.g
   Ai agent-> coding agents to browse other topics deeper and to go back to ai
   agents"* -- the breadcrumb was plain text, so a leaf was a dead end. Both
   segments open their subject, which is the one rule the rest of the page
   already follows: the shelf's panel lists every leaf under it with a count
   and a follow each, so going up is also how you browse sideways, and its
   "See all in the feed" is what lands you back in the shelf itself. */
function topicHead(label, count) {
  if (!label) return '';
  const key = `topic:${label.slug}`;
  const where = label.parent
    ? `<button class="crumb" data-subject="topic:${esc(label.parent)}"
        >${esc(label.parent_name || topicName(label.parent))}</button
        ><span class="crumb-sep"> › </span>`
    : '';
  /* The way out lives here, as it always has for an entity. It used to be the
     `Clear` chip in the filter row above -- which only rendered when you
     followed something, so following nothing and walking into a topic left no
     way back to the feed at all. */
  return `<div class="topic-head">
    <div class="head-row"><div>
      <div class="topic-name">${where}<button class="crumb here"
        data-subject="${esc(key)}">${esc(label.name)}</button></div>
      <div class="topic-meta">${plural(count, 'story')}</div>
    </div><button class="clear" data-leave>Back to feed</button></div>
    <div class="head-follow">${followButton(key, followed(key))}</div>
  </div>`;
}

/* --- Trending's filters ----------------------------------------------------
   The feed shows only what you follow, so its rows are short. Trending is
   everything, and the same rows there are forty-odd chips over four lines
   before a single headline. So Trending collapses the lot into one bar that
   says what is currently on, and puts the choosing in a sheet -- the same
   gesture the story detail and the profile chooser already use.

   The bar reads as a sentence rather than as controls, because most of the
   time it is being read, not used. */
/* What is on, and nothing when nothing is. The bar used to open with
   `Everything`, which is the same restatement the chips were carrying: the
   unfiltered state does not need a name, it needs a way in. */
function trendingSummary() {
  const label = topic ? (topicIndex(bundle.stories).get(topic) || {}).name : '';
  const on = [
    trendScope === 'mine' && follows.size ? 'What I follow' : null,
    label || null,
  ].filter(Boolean);
  return on.length ? on.join(' · ') : 'Filter';
}

function renderScope() {
  const row = document.getElementById('scopes');
  if (view !== 'trending') { row.innerHTML = ''; return; }
  const on = narrowed() || (trendScope === 'mine' && follows.size);
  row.innerHTML = `<button class="scopebar${on ? ' on' : ''}" id="open-filters"
    >${esc(trendingSummary())}<span class="caret">&#9662;</span></button>${
    on ? '<button class="scopebar clear-all" data-clear-filters>Clear</button>' : ''}`;
}

/* Everything Trending can be narrowed by, on one screen: scope, then subjects
   a shelf at a time. Counted in the pool each choice would actually apply to,
   so no chip here leads to an empty list.

   There used to be a `Kind` row under the subjects -- the facet axis, offered
   before any subject was chosen. Removed 2026-09-21, on the owner's call:
   *"I would also like to remove the subtopics/kind (code, agents, multimodal
   etc.) which lie under general topics. They do not make sense right now."*
   Facets are still labelled and still in the bundle; nothing in the UI reads
   them. */
function filterSheetHTML() {
  const live = bundle.stories.filter((s) => !marks.dismissed.has(s.story_id));
  const pool = trendScope === 'mine' && follows.size ? live.filter(isFollowed) : live;

  /* One chip, not a pair. `Everything` was the other half, lit whenever the
     other was not -- which only ever restated the row's own state, the same
     thing `All` and `Any kind` were removed for. Tapping the lit chip turns it
     off, and off is everything. */
  const scope = follows.size ? `
    <div class="group-label">Show</div>
    <div class="sheet-chips">
      <button class="leaf${trendScope === 'mine' ? ' on' : ''}"
        data-scope="mine">What I follow</button>
    </div>` : '';

  // Grouped by shelf, so forty topics read as ten short rows.
  const shelves = new Map();
  for (const story of pool) {
    for (const label of story.topics || []) {
      const head = label.parent
        ? { slug: label.parent, name: label.parent_name }
        : { slug: label.slug, name: label.name };
      if (!shelves.has(head.slug)) shelves.set(head.slug, { ...head, n: 0, leaves: new Map() });
      const shelf = shelves.get(head.slug);
      shelf.n += 1;
      if (!label.parent) continue;
      const leaf = shelf.leaves.get(label.slug) || { ...label, n: 0 };
      leaf.n += 1;
      shelf.leaves.set(label.slug, leaf);
    }
  }
  /* Shelves only, until you ask for one. Ten lines you can read in a glance
     beats forty chips you have to scan, and the first tap is a question --
     which shelf -- that the shelf names answer on their own. Opening a shelf
     is the one choice here that is not the last one, so it keeps the sheet
     open, the way scope does. */
  const subjects = [...shelves.values()].sort((a, b) => b.n - a.n).map((shelf) => {
    const leaves = [...shelf.leaves.values()].sort((a, b) => b.n - a.n);
    // A shelf with nothing under it has nothing to expand into, so it picks.
    if (!leaves.length) {
      return `<div class="sheet-shelf">
        <button class="leaf shelf${topic === shelf.slug ? ' on' : ''}"
          data-pick="${esc(shelf.slug)}"
          >${esc(shelf.name)}<span class="n">${shelf.n}</span></button>
      </div>`;
    }
    /* The first chip inside an open shelf is the shelf itself, named rather
       than called `Everything`. It is a selection, and not the same as picking
       every leaf: about 13% of stories are parked on a shelf and belong to no
       leaf at all, so this is the only way to reach them. The open header
       drops its count so the two lines do not read as one thing twice. */
    const open = openShelf === shelf.slug;
    // The shelf lights up for anything chosen inside it, so a collapsed sheet
    // still says where the selection is.
    const holds = topic === shelf.slug || shelf.leaves.has(topic);
    return `<div class="sheet-shelf${open ? ' open' : ''}">
      <button class="leaf shelf${holds ? ' on' : ''}" data-shelf="${esc(shelf.slug)}"
        aria-expanded="${open}">${esc(shelf.name)}${open ? '' : `<span class="n">${shelf.n}</span>`
        }<span class="caret">&#9662;</span></button>
      ${open ? `<div class="sheet-leaves">
        <button class="leaf${topic === shelf.slug ? ' on' : ''}" data-pick="${esc(shelf.slug)}"
          >${esc(shelf.name)}<span class="n">${shelf.n}</span></button>
        ${leaves.map((leaf) =>
          `<button class="leaf${topic === leaf.slug ? ' on' : ''}" data-pick="${esc(leaf.slug)}"
            >${esc(leaf.name)}<span class="n">${leaf.n}</span></button>`).join('')}
      </div>` : ''}
    </div>`;
  }).join('');

  return `
    <div class="sheet-head">
      <h1>Narrow it down</h1>
      ${narrowed() || trendScope === 'mine'
        ? '<button class="linkish sheet-clear" data-clear-filters>Clear all</button>' : ''}
    </div>
    ${scope}
    ${subjects ? `<div class="group-label">Subject</div>${subjects}` : ''}`;
}

/* The shelf a slug sits on, or '' if it sits on none. A selected leaf opens
   its own shelf, so the sheet opens showing where you already are. */
function shelfOf(slug) {
  if (!slug) return '';
  const label = topicIndex(bundle.stories).get(slug);
  return label ? label.parent || label.slug : '';
}

function openFilters() {
  openShelf = shelfOf(topic);
  drawFilters();
  document.getElementById('filter-sheet').classList.add('open');
  document.body.style.overflow = 'hidden';
}

/* Redraws the sheet in place, for the choices that do not finish it. */
function drawFilters() {
  document.getElementById('filter-body').innerHTML = filterSheetHTML();
}

function closeFilters() {
  document.getElementById('filter-sheet').classList.remove('open');
  document.body.style.overflow = '';
}

function render() {
  const live = bundle.stories.filter((s) => !marks.dismissed.has(s.story_id));
  const index = topicIndex(live);
  // A selection whose topic has since gone quiet would otherwise be unclearable.
  if (topic && !index.has(topic)) topic = '';

  if (entity && !live.some((s) => hasEntity(s, entity))) entity = '';
  // The digest is its own page: filter rows belong to the feed, and search
  // there would be searching a list of subjects rather than the news.
  document.body.classList.toggle('digest-view', view === 'topics');
  if (view === 'topics') {
    renderCount(bundle.status, ago(bundle.generated_at));
    renderWho();
    main.innerHTML = digestHTML(live);
    return;
  }
  // Trending's row lives in its sheet, so the header keeps only the summary.
  if (view === 'trending') document.getElementById('filters').innerHTML = '';
  else renderFilters(live);
  renderScope();
  const stories = visible();
  const status = bundle.status;
  const age = ago(bundle.generated_at);
  renderCount(status, age);
  renderWho();

  let html = entity ? entityHead(entity, stories.length)
    : topic ? topicHead(index.get(topic), stories.length) : '';
  if (view === 'trending') {
    html += `<p class="note">Ranked by relevance, how recent it is, and how many
      sources carried it &mdash; not by date. Still being judged.</p>`;
  }
  if (!stories.length) {
    html += `<div class="empty">${
      query ? `Nothing matches <code>${esc(query)}</code>.`
      : view === 'saved' ? 'Nothing saved yet.'
      : !live.length ? 'Nothing here. Run <code>trib run</code> to fetch.'
      : !follows.size ? `Your feed is what you follow, and you are not
          following anything yet. <br>
          <button class="linkish" data-view-jump="topics">Pick some subjects</button>`
      : `Nothing new in what you follow. <br>
          <button class="linkish" data-view-jump="topics">Follow more subjects</button>`}</div>`;
  } else {
    html += stories.map(cardHTML).join('');
  }
  /* Source health is operational detail, not news. It stays in the bundle for
     `trib sources` and for anyone who scrolls to the end, but a red box above
     the feed made every morning start with a fault report. */
  if (status.broken_sources.length) {
    const names = status.broken_sources.map((b) => esc(b.name)).join(', ');
    html += `<p class="health">${plural(status.broken_sources.length, 'source')} `
      + `not responding: ${names}</p>`;
  }
  main.innerHTML = html;
}

/* The chooser stands in for a login screen: no profile selected means the app
   waits, rather than quietly writing someone else's marks into a shared bucket.
   A device that has never seen profiles gets the picker with its existing state
   ready to be claimed by the first name entered. */
function requireProfile() {
  if (profile && profiles.includes(profile)) return true;
  if (profiles.length === 1) { useProfile(profiles[0]); return true; }
  openProfiles();
  return false;
}

/* Four tabs and an avatar leave this slot about forty pixels on a phone, so
   the corpus size goes and the freshness stays: "is this stale" is the only
   question the header has to answer at a glance. The full line is still there
   on a wider screen, and in the tooltip either way. */
const tight = () => window.matchMedia('(max-width: 460px)').matches;

function renderCount(status, age) {
  const full = `${status.stories} stories · updated ${age} ago`;
  const el = document.getElementById('count');
  el.textContent = tight() ? `${age} old` : full;
  el.title = full;
}

function renderWho() {
  document.getElementById('who').textContent = profile ? profile.slice(0, 1).toUpperCase() : '';
}

async function load() {
  main.innerHTML = '<div class="spinner"></div>';
  try {
    // Relative, so it works at a repository subpath on GitHub Pages.
    const res = await fetch('data.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(`${res.status}`);
    bundle = await res.json();
    loadProfileState();
    if (requireProfile()) render();
  } catch (err) {
    main.innerHTML = `<div class="empty">Could not load the feed.<br>
      <code>${esc(err.message)}</code></div>`;
  }
}

/* --- Panels ----------------------------------------------------------------
   A story, a subject, a story opened from inside that subject: these stack,
   and back climbs one level rather than leaving the site -- *"när man klickar
   tillbaka ska man komma upp en nivå liksom"*. The story sheet already pushed
   one history entry for exactly this reason, so that the phone's own back
   gesture closed the story instead of leaving Tributary; this is the same
   mechanism with more than one level in it. */
let panels = [];

const subjectKey = (entry) =>
  (entry.kind === 'entity' ? `entity:${entry.name}` : `topic:${entry.slug}`);

const parseSubject = (value) => (value.startsWith('entity:')
  ? { kind: 'entity', name: value.slice(7) }
  : { kind: 'topic', slug: value.slice(6) });

function openPanel(entry) {
  panels.push(entry);
  /* One history entry per level, so the back arrow, Escape and the phone's own
     gesture are a single path and none of them leaves an entry behind. The URL
     is left alone: these are panels, not pages worth linking to. */
  history.pushState({ depth: panels.length }, '');
  showPanel();
}

/* Back, however it was asked for -- always through history, so the entry goes
   with the panel. */
function closePanel() {
  if (panels.length) history.back();
}

/* Out of all of them at once, for the moves that land you somewhere else:
   walking into a subject's feed, or following a name out of a story. */
function leavePanels() {
  const depth = panels.length;
  panels = [];
  showPanel();
  if (depth) history.go(-depth);
}

window.addEventListener('popstate', () => {
  if (panels.length) panels.pop();
  showPanel();
});

/* The top of the stack is the one panel on screen. Drawn on show rather than
   on push, so a panel you come back to is redrawn with whatever changed while
   you were a level deeper -- a follow toggled, a story read. */
function showPanel() {
  const top = panels[panels.length - 1] || null;
  const story = Boolean(top && top.kind === 'story');
  if (story) fillStory(top.id);
  else if (top) fillSubject(top);
  sheet.classList.toggle('open', story);
  document.getElementById('subject-sheet').classList.toggle('open', Boolean(top) && !story);
  document.body.style.overflow = top ? 'hidden' : '';
  if (!top) settle();
}

/* A story read and then closed greys out without reloading the bundle. */
function settle() {
  const card = main.querySelector(`.card[data-id="${current}"]`);
  if (card) card.classList.add('seen');
  current = null;
}

function openStory(id) {
  if (bundle.stories.some((s) => s.story_id === id)) openPanel({ kind: 'story', id });
}

/* --- A subject as a place --------------------------------------------------
   Tapping a subject used to do one of two things, and neither of them opened
   it: a shelf name went to the feed and cleared the scope on the way, which
   for anyone following nothing is an empty feed, and a leaf chip toggled a
   follow without moving at all. Asked for 2026-09-21:

     "I can not see topics when I click them now. It just navigates me to an
      empty feed. I would also like to get a popup when I click a topic and a
      chance to follow (similar to an instagram profile)."

   So a subject opens as a panel shaped like a profile: its name and whether
   you follow it together at the top, then what sits under it, then what is in
   it. Following is a button rather than a chip's tint -- that is what makes it
   clear what is followed, and it ends the collision where one chip shape
   navigated in one place and followed in another. The walk-in is still here,
   as "See all in the feed", so nothing that used to be reachable has gone. */
function subjectStories(entry) {
  const live = bundle.stories.filter((s) => !marks.dismissed.has(s.story_id));
  return byDate(entry.kind === 'entity'
    ? live.filter((s) => hasEntity(s, entry.name))
    : live.filter((s) => hasTopic(s, entry.slug)));
}

/* The spine first, then the stories: a subject you follow may have gone quiet
   or left the config, and both of those still have to open. */
function subjectLabel(slug) {
  return (bundle.spine || []).find((t) => t.slug === slug)
    || topicIndex(bundle.stories).get(slug)
    || { slug, name: slug, parent: null, parent_name: null };
}

/* Stories filed on the shelf itself rather than on any leaf under it. They
   exist because of **parking**: when a story's top two leaves share a shelf and
   sit within `park_margin`, the shelf is clear but the leaf is a coin-toss, so
   it stays on the shelf. `hasTopic` counts them in the shelf's total and no
   leaf row can, so without a row of their own the panel says 24 above a list
   adding to 21 -- which is what it did, and what was reported. About 13% of
   the corpus is parked, so the gap is the rule rather than an edge case. */
function parkedOn(slug, stories) {
  const rows = stories.filter((s) =>
    (s.topics || []).some((label) => label.slug === slug && !label.parent));
  return { n: rows.length, unseen: rows.filter((s) => !marks.seen.has(s.story_id)).length };
}

/* What sits under a shelf: the leaves this bundle has stories for, plus any
   leaf you follow. Without that second half a shelf is where a quiet follow
   goes to hide, which is the bug "Followed, but quiet" exists to prevent. */
function subjectLeaves(slug, stories) {
  const rows = new Map();
  for (const story of stories) {
    for (const label of story.topics || []) {
      if (label.parent !== slug) continue;
      const row = rows.get(label.slug)
        || { slug: label.slug, name: label.name, n: 0, unseen: 0 };
      row.n += 1;
      if (!marks.seen.has(story.story_id)) row.unseen += 1;
      rows.set(label.slug, row);
    }
  }
  for (const t of bundle.spine || []) {
    if (t.parent === slug && follows.has(`topic:${t.slug}`) && !rows.has(t.slug)) {
      rows.set(t.slug, { slug: t.slug, name: t.name, n: 0, unseen: 0 });
    }
  }
  return [...rows.values()].sort((a, b) => b.unseen - a.unseen || b.n - a.n);
}

const MAX_HEADLINES = 12;

/* One number unless two say something: a row where everything is unread does
   not need to say the same figure twice. Shared with the profile chooser's
   follows list, which counts the same way. */
function leafCount(leaf) {
  if (!leaf.n) return 'quiet';
  if (!leaf.unseen) return String(leaf.n);
  return leaf.unseen === leaf.n
    ? `<span class="new">${leaf.unseen} new</span>`
    : `<span class="new">${leaf.unseen} new</span> · ${leaf.n}`;
}

function fillSubject(entry) {
  const stories = subjectStories(entry);
  const unseen = stories.filter((s) => !marks.seen.has(s.story_id)).length;
  const key = subjectKey(entry);
  const on = followed(key);
  const label = entry.kind === 'topic' ? subjectLabel(entry.slug) : null;
  const name = entry.kind === 'entity' ? entry.name : label.name;
  const leaves = entry.kind === 'entity' ? [] : subjectLeaves(entry.slug, stories);
  /* Only a shelf can hold parked stories, and only when it has leaves to have
     been undecided between. */
  const parked = entry.kind === 'topic' && leaves.length
    ? parkedOn(entry.slug, stories) : { n: 0, unseen: 0 };

  /* A leaf names its shelf, and the name climbs: reached from a story chip,
     the shelf is the level above and there is otherwise no way up to it. */
  const parent = entry.kind === 'topic' && label.parent
    ? `<button class="subject-where" data-subject="topic:${esc(label.parent)}"
        >${esc(label.parent_name || topicName(label.parent))}</button>`
    : entry.kind === 'entity'
      ? `<span class="subject-where">${esc((bundle.stories.flatMap((s) => s.entities || [])
          .find((e) => e.name === entry.name) || {}).kind || 'name')}</span>`
      : '';

  /* The bar, so a stack of full-screen panels is not a stack of identical
     ones: a leaf says which shelf it came from, a shelf says its own name. */
  document.getElementById('subject-where').textContent = entry.kind === 'topic' && label.parent
    ? `${label.parent_name || topicName(label.parent)} › ${name}`
    : name;

  document.getElementById('subject-body').innerHTML = `
    ${parent}
    <h1 class="subject-title">${esc(name)}</h1>
    <p class="subject-stat">${stories.length
      ? `${plural(stories.length, 'story')}${unseen ? ` · <strong>${unseen} new</strong>` : ' · all read'}`
      : 'Nothing in the feed right now'}</p>
    <div class="subject-actions">
      <button class="follow wide${on ? ' on' : ''}" data-follow="${esc(key)}"
        aria-pressed="${on}">${on ? 'Following' : 'Follow'}</button>
      ${stories.length
        ? `<button class="subject-go" data-see-feed="${esc(key)}">See all in the feed</button>`
        : ''}
    </div>
    ${leaves.length ? `<div class="group-label">Under this</div>
      ${leaves.map((leaf) => {
        const lk = `topic:${leaf.slug}`;
        const lon = followed(lk);
        return `<div class="subject-row">
          <button class="subject-leaf" data-subject="${esc(lk)}">${esc(leaf.name)}<span
            class="n">${leafCount(leaf)}</span></button>
          <button class="follow${lon ? ' on' : ''}" data-follow="${esc(lk)}"
            aria-pressed="${lon}">${lon ? 'Following' : 'Follow'}</button>
        </div>`;
      }).join('')}
      ${parked.n ? `<div class="subject-row">
        <span class="subject-leaf as-text">Not under a subtopic<span
          class="n">${leafCount(parked)}</span></span>
      </div>
      <p class="subject-note">Too close to call between two of these, so they
        sit on ${esc(name)} itself. Following ${esc(name)} still collects
        them.</p>` : ''}` : ''}
    ${stories.length ? `<div class="group-label">Latest</div>
      ${stories.slice(0, MAX_HEADLINES).map((s) =>
        `<button class="headline${marks.seen.has(s.story_id) ? ' seen' : ''}"
          data-open="${s.story_id}">${esc(s.title)}
          <span class="when">· ${esc(ago(s.published_at))}</span></button>`).join('')}
      ${stories.length > MAX_HEADLINES
        ? `<p class="subject-none">${stories.length - MAX_HEADLINES} more in the feed.</p>` : ''}`
      : `<p class="subject-none">Nothing carries this subject in the current
          bundle. It still counts as something you follow.</p>`}`;
}

function fillStory(id) {
  const s = bundle.stories.find((x) => x.story_id === id);
  if (!s) return;
  current = id;
  mark('seen', id, true);

  const groups = {};
  for (const item of s.items) (groups[item.role] ||= []).push(item);
  const order = ['seed', 'paper', 'code', 'video', 'coverage', 'discussion'];
  const names = {
    seed: 'Source', paper: 'Paper', code: 'Code',
    video: 'Video', coverage: 'Coverage', discussion: 'Discussion',
  };

  document.getElementById('sheet-body').innerHTML = `
    ${s.media_url ? `<img class="hero" src="${esc(s.media_url)}" alt=""
      referrerpolicy="no-referrer">` : ''}
    <h1>${esc(s.title)}</h1>
    ${(s.topics || []).length ? `<div class="sheet-topics">${
      (s.topics || []).map((t) =>
        `<button class="chip topic-link" data-subject="topic:${esc(t.slug)}">${
          t.parent_name ? esc(t.parent_name) + ' › ' : ''}${esc(t.name)}</button>`).join('')
    }${(s.entities || []).map((e) =>
        `<button class="chip entity-link" data-subject="entity:${esc(e.name)}"
          >${esc(e.name)}</button>`).join('')}</div>`
      : (s.entities || []).length ? `<div class="sheet-topics">${
      s.entities.map((e) =>
        `<button class="chip entity-link" data-subject="entity:${esc(e.name)}"
          >${esc(e.name)}</button>`).join('')}</div>` : ''}
    ${s.summary ? `<p class="abstract">${esc(s.summary)}</p>` : ''}
    ${order.filter((r) => groups[r]).map((role) => `
      <div class="group-label">${esc(names[role] || role)}</div>
      ${groups[role].map((item) => {
        const drew = engagement(item.engagement);
        return `
        <a class="item" href="${esc(item.url)}" target="_blank" rel="noopener">
          <div class="item-title">${esc(item.title)}</div>
          ${item.summary ? `<p class="item-summary">${esc(item.summary)}</p>` : ''}
          <div class="item-meta">${esc(item.source)}${
            item.author ? ' · ' + esc(item.author) : ''}${
            item.published_at ? ' · ' + esc(item.published_at.slice(0, 10)) : ''}${
            drew ? ` · <span class="eng">${drew}</span>` : ''}</div>
        </a>`;
      }).join('')}
    `).join('')}`;

  document.getElementById('save-detail').innerHTML = marks.saved.has(id) ? '&#9733;' : '&#9734;';
}

function toggleSave(id) {
  const on = !marks.saved.has(id);
  mark('saved', id, on);
  return on;
}

function selectView(next) {
  view = next;
  store(key('view'), view);
  document.querySelectorAll('.tab').forEach((t) =>
    t.setAttribute('aria-selected', String(t.dataset.view === view)));
  render();
  window.scrollTo({ top: 0 });
}

document.addEventListener('click', (event) => {
  if (event.target.closest('#who')) { openProfiles(); return; }
  if (event.target.closest('#close-profiles')) {
    // Only closable once somebody is chosen; otherwise there is no feed behind it.
    if (profile) closeProfiles();
    return;
  }
  const use = event.target.closest('[data-use]');
  if (use) { useProfile(use.dataset.use); return; }

  const drop = event.target.closest('[data-drop]');
  if (drop) {
    const name = drop.dataset.drop;
    if (confirm(`Remove ${name}? Their follows and saved stories on this device go too.`)) {
      removeProfile(name);
    }
    return;
  }
