  const tab = event.target.closest('.tab');
  if (tab) {
    selectView(tab.dataset.view);
    return;
  }

  // Out of a place, whichever kind it was, and back to the feed itself.
  if (event.target.closest('[data-leave]')) {
    entity = '';
    topic = '';
    store(key('topic'), '');
    render();
    window.scrollTo({ top: 0 });
    return;
  }

  /* Following is checked before the cards and chips it sits among. Neither
     the digest nor an open panel may jump to the top afterwards: you are
     choosing several subjects in a row, and a page that scrolls itself after
     each one is unusable. */
  const follow = event.target.closest('[data-follow]');
  if (follow) {
    event.stopPropagation();
    toggleFollow(follow.dataset.follow);
    const at = window.scrollY;
    render();
    // Whatever is on top has to show it worked; the feed behind it has changed
    // too, so it is redrawn either way.
    if (document.getElementById('profiles').classList.contains('open')) renderProfiles();
    else if (panels.length) showPanel();
    else if (view === 'topics') window.scrollTo({ top: at });
    return;
  }

  if (event.target.closest('#open-filters')) { openFilters(); return; }
  if (event.target.closest('#close-filters')) { closeFilters(); return; }
  if (event.target.closest('[data-clear-filters]')) {
    topic = '';
    entity = '';
    trendScope = 'all';
    store(key('topic'), '');
    render();
    // Tapped inside the sheet, the sheet is what has to show it worked.
    if (document.getElementById('filter-sheet').classList.contains('open')) drawFilters();
    return;
  }

  /* Scope and opening a shelf keep the sheet open: neither is a choice you
     came here to make, only one that changes what is worth offering next. A
     subject is the answer, so that applies and gets out of the way. */
  const scope = event.target.closest('[data-scope]');
  if (scope) {
    trendScope = trendScope === scope.dataset.scope ? 'all' : scope.dataset.scope;
    render();
    drawFilters();
    return;
  }

  // Opening a shelf is not a filter: nothing is chosen yet, so nothing moves.
  const shelfToggle = event.target.closest('[data-shelf]');
  if (shelfToggle) {
    const slug = shelfToggle.dataset.shelf;
    openShelf = openShelf === slug ? '' : slug;
    drawFilters();
    return;
  }

  const pick = event.target.closest('[data-pick]');
  if (pick) {
    entity = '';
    topic = topic === pick.dataset.pick ? '' : pick.dataset.pick;
    store(key('topic'), topic);
    closeFilters();
    render();
    window.scrollTo({ top: 0 });
    return;
  }

  /* Tapping a subject opens it, wherever it was tapped: the digest, a story's
     chips, a name on a card. One gesture, one meaning. */
  const subject = event.target.closest('[data-subject]');
  if (subject) {
    event.stopPropagation();
    // Tapped in the profile chooser, which is not a layer to come back to.
    if (profile) closeProfiles();
    openPanel(parseSubject(subject.dataset.subject));
    return;
  }

  /* The walk-in, from inside the panel: the feed, scoped to this subject. A
     place you walked into shows what is in it whether or not you follow it,
     so this never lands on the empty feed the panel was built to replace. */
  const walk = event.target.closest('[data-see-feed]');
  if (walk) {
    const into = parseSubject(walk.dataset.seeFeed);
    entity = into.kind === 'entity' ? into.name : '';
    topic = into.kind === 'topic' ? into.slug : '';
    store(key('topic'), topic);
    leavePanels();
    if (view === 'feed') { render(); window.scrollTo({ top: 0 }); } else selectView('feed');
    return;
  }

  const jump = event.target.closest('[data-view-jump]');
  if (jump) {
    if (profile) closeProfiles();
    selectView(jump.dataset.viewJump);
    return;
  }

  // A headline on the digest opens its story, without leaving the digest.
  const open = event.target.closest('[data-open]');
  if (open) {
    event.stopPropagation();
    openStory(Number(open.dataset.open));
    return;
  }

  const filter = event.target.closest('.filter');
  if (filter) {
    entity = '';
    topic = topic === filter.dataset.topic ? '' : filter.dataset.topic;
    store(key('topic'), topic);
    render();
    return;
  }

  const action = event.target.closest('[data-act]');
  if (action) {
    event.stopPropagation();
    const card = action.closest('.card');
    const id = Number(card.dataset.id);
    if (action.dataset.act === 'saved') {
      const on = toggleSave(id);
      action.classList.toggle('on', on);
      action.innerHTML = on ? '&#9733;' : '&#9734;';
    } else {
      mark('dismissed', id, true);
      card.classList.add('gone');
      setTimeout(() => card.remove(), 220);
    }
    return;
  }

  const card = event.target.closest('.card');
  if (card) openStory(Number(card.dataset.id));
});

/* Feed art is hotlinked from whatever the source published, so some of it will
   404 or be blocked. Drop those rather than leave a grey box on the card.
   Capture, because error events do not bubble. */
document.addEventListener('error', (event) => {
  if (event.target instanceof HTMLImageElement) event.target.remove();
}, true);

/* Delegated, because the form is rebuilt every time the chooser opens. */
document.addEventListener('submit', (event) => {
  if (event.target.id !== 'new-profile') return;
  event.preventDefault();
  const input = document.getElementById('profile-name');
  const name = addProfile(input.value);
  if (name) useProfile(name);
});

document.getElementById('search').addEventListener('input', (event) => {
  query = event.target.value.trim().toLowerCase();
  render();
});

document.getElementById('close').addEventListener('click', closePanel);
document.getElementById('close-subject').addEventListener('click', closePanel);
document.getElementById('save-detail').addEventListener('click', (event) => {
  if (current !== null) event.currentTarget.innerHTML = toggleSave(current) ? '&#9733;' : '&#9734;';
});
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') closePanel();
});

document.querySelectorAll('.tab').forEach((t) =>
  t.setAttribute('aria-selected', String(t.dataset.view === view)));
load();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
