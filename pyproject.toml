[project]
name = "tributary"
version = "0.1.0"
description = "A personal AI-news feed: many sources, one river."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "feedparser>=6.0.11",
    "httpx>=0.28",
    "platformdirs>=4.3",
    "python-dateutil>=2.9",
    "rich>=13.9",
    "sqlite-vec>=0.1.9",
    "typer>=0.15",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
trib = "tributary.cli:app"

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=8.3",
    "pytest-httpx>=0.35",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tributary"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # starlette's TestClient still imports httpx 1.x; nothing for us to change.
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
