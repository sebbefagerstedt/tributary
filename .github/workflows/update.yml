name: Update feed

# Runs the pipeline on a schedule and publishes the result to GitHub Pages.
#
# The database is NOT committed. It lives in the Actions cache: committing a
# multi-megabyte binary every hour would grow the repository without bound,
# since git stores each version in full. A cache miss is survivable -- the run
# rebuilds from the sources, which is slower but self-healing.
on:
  schedule:
    # Every three hours, at minute 17. Eight runs a day rather than three, so
    # the feed is never much more than a commute out of date, and no window
    # matters enough to chase when GitHub drops one.
    #
    # Minute 17, not 0. GitHub queues every repository's on-the-hour schedules
    # at once and delays them under load; minute 0 here ran about 18 minutes
    # late, which is normal rather than broken. An odd minute just shortens
    # that wait.
    #
    # Cron is UTC and cannot follow daylight saving, so in Swedish summer time
    # these land at 02:17, 05:17, 08:17 ... 23:17 local, an hour earlier in
    # winter. Treat them as "about then": scheduled runs are delayed under load.
    - cron: "17 */3 * * *"
  workflow_dispatch:          # and a "Run workflow" button
  push:
    branches: [main]
    paths:
      - "config.toml"
      - "src/**"
      - ".github/workflows/update.yml"

concurrency:
  group: feed
  cancel-in-progress: false   # never interrupt a run mid-write

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Keyed by run number so each run writes a fresh entry; restore-keys falls
      # back to the newest existing one, because a cache entry cannot be updated
      # in place.
      - name: Restore database
        uses: actions/cache@v4
        with:
          path: tributary.db
          key: tributary-db-${{ github.run_number }}
          restore-keys: tributary-db-

      # ~130MB of ONNX weights; re-downloading them every run would dominate.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: fastembed-bge-small-en-v1.5

      - run: uv sync --frozen --no-dev

      - name: Fetch, triage and cluster
        # trib run exits non-zero if any source failed. That is deliberate, but
        # one flaky feed out of nineteen must not stop the deploy: the site
        # shows failing sources at the top of the feed instead.
        continue-on-error: true
        run: uv run trib run

      # Keeps the cached database small and quick to restore.
      - name: Prune old items
        run: uv run trib prune --days 60 --yes

      # A story's clock runs from its newest item, so a late arrival restarts
      # it. Whether that is the wake working or a stale story being carried is
      # a question about the corpus, and the corpus only exists here -- the
      # database is in the cache, not the repository. So the run measures it
      # and leaves the answer in the log. Never fails the deploy: it is a
      # reading, not a check.
      - name: Measure what late arrivals do to the order
        continue-on-error: true
        run: uv run trib renewal --limit 40 --days 30

      - name: Build the site
        run: uv run trib export site --days 30 --limit 120

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
